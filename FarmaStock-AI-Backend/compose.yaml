name: farmastock-ai
x-base-env: &base-env
  DB_HOST: 172.31.249.199
  DB_PORT: 3306
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  INTERNAL_KEY: ${INTERNAL_KEY}
  JWT_SECRET: ${JWT_SECRET}

x-ms-depends: &ms-depends
  rabbitmq:
    condition: service_healthy

services:
  mysql:
    profiles: ["docker-mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_CATALOG_PASSWORD: ${DB_CATALOG_PASSWORD}
      DB_INVENTORY_PASSWORD: ${DB_INVENTORY_PASSWORD}
      DB_PURCHASE_PASSWORD: ${DB_PURCHASE_PASSWORD}
      DB_SALES_PASSWORD: ${DB_SALES_PASSWORD}
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL','mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '127.0.0.1:15672:15672'
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD','rabbitmq-diagnostics','-q','ping']
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes: [qdrant_data:/qdrant/storage]
    ports: ['127.0.0.1:6333:6333']
    restart: unless-stopped
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.118.2
    environment:
      GENERIC_TIMEZONE: America/Merida
      TZ: America/Merida
      N8N_DIAGNOSTICS_ENABLED: 'false'
    ports: ['127.0.0.1:5678:5678']
    volumes: [n8n_data:/home/node/.n8n]
    restart: unless-stopped
    networks: [internal]

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      auth-service: {condition: service_started}
      catalog-service: {condition: service_started}
      inventory-service: {condition: service_started}
    restart: unless-stopped
    networks: [internal]

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: auth}
    environment:
      <<: *base-env
      SERVICE_NAME: auth
      PORT: 3001
      DB_NAME: db_usuarios
      DB_USER: farm_auth
      DB_PASSWORD: ${DB_AUTH_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  catalog-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: catalog}
    environment:
      <<: *base-env
      SERVICE_NAME: catalog
      PORT: 3002
      DB_NAME: db_catalogo
      DB_USER: farm_catalog
      DB_PASSWORD: ${DB_CATALOG_PASSWORD}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  inventory-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: inventory}
    environment:
      <<: *base-env
      SERVICE_NAME: inventory
      PORT: 3003
      DB_NAME: db_inventarios
      DB_USER: farm_inventory
      DB_PASSWORD: ${DB_INVENTORY_PASSWORD}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  purchase-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: purchase}
    environment:
      <<: *base-env
      SERVICE_NAME: purchase
      PORT: 3004
      DB_NAME: db_compras
      DB_USER: farm_purchase
      DB_PASSWORD: ${DB_PURCHASE_PASSWORD}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  sales-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: sales}
    environment:
      <<: *base-env
      SERVICE_NAME: sales
      PORT: 3005
      DB_NAME: db_ventas
      DB_USER: farm_sales
      DB_PASSWORD: ${DB_SALES_PASSWORD}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: notification}
    environment:
      <<: *base-env
      SERVICE_NAME: notification
      PORT: 3006
      DB_NAME: db_notificaciones
      DB_USER: farm_notification
      DB_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args: {SERVICE: ai}
    environment:
      <<: *base-env
      SERVICE_NAME: ai
      PORT: 3007
      DB_NAME: db_predicciones
      DB_USER: farm_ai
      DB_PASSWORD: ${DB_AI_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QDRANT_URL: http://qdrant:6333
    depends_on: *ms-depends
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  rabbit_data:
  qdrant_data:
  n8n_data:
